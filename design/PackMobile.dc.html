<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #0f2536;
      font-feature-settings: "cv11", "ss01";
      -webkit-font-smoothing: antialiased;
    }
    a { color: #0ea5e9; }
    a:hover { color: #0284c7; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes sweep { 0% { top: 8%; } 50% { top: 84%; } 100% { top: 8%; } }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: rgba(10,20,30,0.35); display: flex; flex-direction: column; justify-content: flex-end;">

  <!-- full-height sheet: on a phone the modal is the screen -->
  <div style="height: 800px; background: #ffffff; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -8px 40px -12px rgba(13,60,82,0.3); display: flex; flex-direction: column; overflow: hidden;">

    <!-- grabber -->
    <div style="display: flex; justify-content: center; padding-top: 8px; padding-bottom: 2px;">
      <div style="width: 36px; height: 4px; border-radius: 999px; background: rgba(13,110,140,0.18);"></div>
    </div>

    <!-- header -->
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px 14px; border-bottom: 1px solid rgba(13,110,140,0.1);">
      <div style="display: flex; align-items: center; gap: 9px; min-width: 0;">
        <svg width="18" height="18" style="flex-shrink: 0;" viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>
          <path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M3 12h18"/>
        </svg>
        <h2 style="margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em;">Scan barcode</h2>
        <span style="display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 9px; font-size: 11.5px; font-weight: 500; background: rgba(14,165,233,0.1); color: #0ea5e9;">
          <span style="width: 5px; height: 5px; border-radius: 999px; background: #0ea5e9;"></span>Packing
        </span>
      </div>
      <div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f2536" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </div>
    </div>

    <!-- scrolling content -->
    <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 14px 16px;">

      <!-- viewfinder: the biggest thing on a phone, it is what you aim -->
      <div style="position: relative; border-radius: 14px; overflow: hidden; background: #0b1a24; height: 300px; flex-shrink: 0;">
        <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 44%, #21414f 0%, #0d1f2a 62%, #08141c 100%);"></div>
        <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-4deg); width: 232px; height: 150px; border-radius: 6px; background: linear-gradient(160deg, #d8c39d, #c2a87e); box-shadow: 0 18px 30px -12px rgba(0,0,0,0.6);"></div>
        <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-4deg); display: flex; gap: 3px; align-items: flex-end; height: 56px;">
          <div style="width:4px;height:100%;background:#111"></div><div style="width:2px;height:100%;background:#111"></div>
          <div style="width:6px;height:100%;background:#111"></div><div style="width:3px;height:100%;background:#111"></div>
          <div style="width:2px;height:100%;background:#111"></div><div style="width:5px;height:100%;background:#111"></div>
          <div style="width:3px;height:100%;background:#111"></div><div style="width:2px;height:100%;background:#111"></div>
          <div style="width:6px;height:100%;background:#111"></div><div style="width:2px;height:100%;background:#111"></div>
          <div style="width:4px;height:100%;background:#111"></div><div style="width:3px;height:100%;background:#111"></div>
        </div>

        <div style="position: absolute; left: 10%; right: 10%; top: 22%; bottom: 22%;">
          <div style="position:absolute;left:0;top:0;width:30px;height:30px;border-top:3px solid #22d3ee;border-left:3px solid #22d3ee;border-top-left-radius:10px;"></div>
          <div style="position:absolute;right:0;top:0;width:30px;height:30px;border-top:3px solid #22d3ee;border-right:3px solid #22d3ee;border-top-right-radius:10px;"></div>
          <div style="position:absolute;left:0;bottom:0;width:30px;height:30px;border-bottom:3px solid #22d3ee;border-left:3px solid #22d3ee;border-bottom-left-radius:10px;"></div>
          <div style="position:absolute;right:0;bottom:0;width:30px;height:30px;border-bottom:3px solid #22d3ee;border-right:3px solid #22d3ee;border-bottom-right-radius:10px;"></div>
          <div style="position:absolute;left:8px;right:8px;height:2px;background:linear-gradient(90deg,transparent,#22d3ee,transparent);box-shadow:0 0 12px #22d3ee;animation: sweep 2.6s ease-in-out infinite;"></div>
        </div>

        <div style="position: absolute; left: 12px; top: 12px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 500; background: rgba(8,20,28,0.6); color: #d6f4ff; backdrop-filter: blur(6px);">
          <span style="width: 6px; height: 6px; border-radius: 999px; background: #10b981;"></span>Camera on
        </div>
        <p style="position: absolute; left: 0; right: 0; bottom: 14px; margin: 0; text-align: center; font-size: 12.5px; color: #a9cede;">Hold the label inside the frame</p>
      </div>

      <!-- manual entry: 44px minimum target -->
      <div style="position: relative; flex-shrink: 0;">
        <input class="mono" placeholder="or type the code" style="width: 100%; box-sizing: border-box; height: 46px; border-radius: 12px; border: 1px solid rgba(13,110,140,0.1); background: #eef6fa; padding: 0 14px 0 40px; font-size: 14px; color: #0f2536; outline: none;">
        <svg style="position: absolute; left: 14px; top: 15px;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8ba0b0" stroke-width="2" stroke-linecap="round"><path d="M3 5v14"/><path d="M8 5v14"/><path d="M12 5v14"/><path d="M17 5v14"/><path d="M21 5v14"/></svg>
      </div>

      <!-- result -->
      <div style="border-radius: 12px; border: 1px solid rgba(13,110,140,0.1); background: #eef6fa; padding: 12px; display: flex; gap: 12px; flex-shrink: 0;">
        <div style="width: 56px; height: 70px; flex-shrink: 0; border-radius: 8px; background: linear-gradient(155deg, #7d2c3c, #4d1a24);"></div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;">
          <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
            <span class="mono" style="font-size: 12.5px; font-weight: 500;">408-9310950-5878756</span>
            <span style="display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 500; background: rgba(217,138,43,0.12); color: #d98a2b;">COD</span>
          </div>
          <p style="margin: 0; font-size: 13px; line-height: 1.4; text-wrap: pretty;">Paribelle Cotton Printed Gopi Style Kurti Sharara Set with Dupatta (L, Wine Maroon)</p>
          <div style="display: flex; gap: 10px; font-size: 11.5px; color: #5c7386;">
            <span class="mono">M2-Q4UR-WDZ0</span><span>Qty 1</span><span>₹999</span>
          </div>
        </div>
      </div>

    </div>

    <!-- sticky action bar: thumb reach, 48px target -->
    <div style="flex-shrink: 0; padding: 12px 16px 22px; border-top: 1px solid rgba(13,110,140,0.1); background: #ffffff; display: flex; gap: 10px;">
      <button style="width: 96px; height: 48px; border: 1px solid rgba(13,110,140,0.1); cursor: pointer; border-radius: 12px; font-size: 15px; font-weight: 500; font-family: inherit; background: #ffffff; color: #0f2536; box-shadow: 0 1px 2px rgba(13,60,82,0.05);">Skip</button>
      <button style="flex-grow: 1; height: 48px; border: 1px solid transparent; cursor: pointer; border-radius: 12px; font-size: 15px; font-weight: 600; font-family: inherit; color: #fff; background: linear-gradient(135deg, #0ea5e9, #22d3ee); box-shadow: 0 1px 2px rgba(13,60,82,0.05), 0 6px 16px -6px rgba(14,165,233,0.55);">Confirm packed</button>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
