# Every push to production:
#   sync   test the sync against its stand-ins, publish ghcr.io/<owner>/paribelle-sync
#   edge   test the edge Worker, deploy it (paribelle-edge: www.paribelle.in, api.paribelle.in)
#   oms    publish the OMS's image, ghcr.io/<owner>/pom
#   render publish Seelie's video renderer, ghcr.io/<owner>/pom-render (infra/render)
#   thinkpad  tell the ThinkPad the images are up, so it updates now (infra/hook.mjs);
#          without the call it still does within 5 minutes (infra/update.sh)
# Vercel builds the OMS from the same push, as before, for the fallback, and migrates the
# cloud database first (vercel.json); the ThinkPad migrates its own (oms-migrate).
#
# Secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (without them the Worker isn't
# deployed), THINKPAD_DEPLOY_KEY (infra/deploy-key.sh). See infra/README.md.
name: deploy

on:
  push: { branches: [production] }
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: docker compose -f infra/sync/test/compose.yml run --rm --build test
      - name: Stop the stand-ins
        if: always()
        run: docker compose -f infra/sync/test/compose.yml down -v
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/paribelle-sync" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: infra/sync
          target: runtime
          platforms: linux/amd64
          build-args: RELEASE=${{ github.sha }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=sync
          cache-to: type=gha,mode=max,scope=sync

  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: infra/edge } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: infra/edge/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Deploy the Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      # wrangler deploy rewrites the Worker's routes, which turns "fail open" back off. With it
      # on, a day past the free allowance means Vercel serves www, not an error page.
      - name: Fail open on www
        if: env.CLOUDFLARE_API_TOKEN != ''
        env: { ZONE_ID: c0e3f99f1ee15de925d96bad2f39d652 } # paribelle.in
        run: |
          api="https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          id=$(curl -fsS -H "$auth" "$api" | jq -r '.result[] | select(.pattern == "www.paribelle.in/*") | .id')
          [ -n "$id" ] || { echo "no www.paribelle.in/* route"; exit 1; }
          curl -fsS -X PUT -H "$auth" -H "Content-Type: application/json" "$api/$id" \
            -d '{"pattern":"www.paribelle.in/*","script":"paribelle-edge","request_limit_fail_open":true}' > /dev/null
          curl -fsS -H "$auth" "$api" |
            jq -e '.result[] | select(.pattern == "www.paribelle.in/*") | .request_limit_fail_open == true'

  oms:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v5
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pom" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          build-args: RELEASE=${{ github.sha }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=oms
          cache-to: type=gha,mode=max,scope=oms

  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v5
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pom-render" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: infra/render
          platforms: linux/amd64
          build-args: RELEASE=${{ github.sha }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=render
          cache-to: type=gha,mode=max,scope=render

  thinkpad:
    needs: [sync, oms, render]
    # Whatever did publish is worth picking up, even if the other image failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Tell the ThinkPad
        env: { KEY: "${{ secrets.THINKPAD_DEPLOY_KEY }}" }
        run: |
          [ -n "$KEY" ] || { echo "No THINKPAD_DEPLOY_KEY secret: the ThinkPad updates at its next 5-minute check."; exit 0; }
          curl -fsS --max-time 20 --retry 3 --retry-all-errors -X POST \
            -H "Authorization: Bearer $KEY" -H "X-Paribelle-Repo: $GITHUB_REPOSITORY" \
            https://laptop.paribelle.in/_paribelle/deploy ||
            echo "::warning::The ThinkPad didn't answer; it updates at its next 5-minute check."
