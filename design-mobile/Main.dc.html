<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: #0f2536; font-feature-settings: "cv11","ss01"; -webkit-font-smoothing: antialiased; }
    a { color: #0ea5e9; } a:hover { color: #0284c7; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</helmet>

<div style="width: 375px; height: 812px; box-sizing: border-box; background: #f4f9fc; background-image: radial-gradient(circle at 14% -8%, rgba(14,165,233,0.10), transparent 42%), radial-gradient(circle at 88% 18%, rgba(34,211,238,0.07), transparent 38%); display: flex; flex-direction: column; overflow: hidden;">

  <!-- header: brand + avatar + sync, condensed to one band -->
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; background: #ffffff; border-bottom: 1px solid rgba(13,110,140,0.1);">
    <span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #0ea5e9, #22d3ee);">P</span>
    <div style="flex-grow: 1; min-width: 0;">
      <div style="font-size: 14px; font-weight: 600; letter-spacing: -0.01em;">Dashboard</div>
      <div style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: #5c7386;">
        <span style="width: 6px; height: 6px; border-radius: 999px; background: #10b981; box-shadow: 0 0 0 2px rgba(16,185,129,0.12);"></span>
        Synced 12 min ago
      </div>
    </div>
    <button style="flex-shrink: 0; width: 34px; height: 34px; border-radius: 999px; border: 1px solid rgba(13,110,140,0.1); background: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(13,60,82,0.05);">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
    <span style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #0ea5e9, #22d3ee);">A</span>
  </div>

  <!-- range picker: horizontal scroll chips instead of a desktop segmented control -->
  <div style="flex-shrink: 0; display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; background: #ffffff; border-bottom: 1px solid rgba(13,110,140,0.1);">
    <div style="flex-shrink: 0; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; color: #5c7386; background: #eef6fa; border: 1px solid rgba(13,110,140,0.1);">7d</div>
    <div style="flex-shrink: 0; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #0ea5e9, #22d3ee);">30d</div>
    <div style="flex-shrink: 0; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; color: #5c7386; background: #eef6fa; border: 1px solid rgba(13,110,140,0.1);">90d</div>
    <div style="flex-shrink: 0; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; color: #5c7386; background: #eef6fa; border: 1px solid rgba(13,110,140,0.1);">This year</div>
  </div>

  <!-- scrolling content -->
  <div style="flex-grow: 1; overflow-y: auto; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 12px;">

    <!-- stats: single column, full width — the 5-up desktop grid can't survive 375px -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="position: relative; overflow: hidden; border-radius: 16px; border: 1px solid rgba(13,110,140,0.1); background: #ffffff; box-shadow: 0 1px 2px rgba(13,60,82,0.04), 0 8px 20px -10px rgba(13,60,82,0.12); padding: 13px 16px 13px 20px; display: flex; align-items: center; justify-content: space-between;">
        <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 999px; background: #0ea5e9; opacity: 0.5;"></span>
        <div style="font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: #8ba0b0;">Revenue</div>
        <div class="mono" style="font-size: 20px; font-weight: 600; color: #0f2536;">₹4.2L</div>
      </div>
      <div style="position: relative; overflow: hidden; border-radius: 16px; border: 1px solid rgba(13,110,140,0.1); background: #ffffff; box-shadow: 0 1px 2px rgba(13,60,82,0.04), 0 8px 20px -10px rgba(13,60,82,0.12); padding: 13px 16px 13px 20px; display: flex; align-items: center; justify-content: space-between;">
        <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 999px; background: #0ea5e9; opacity: 0.5;"></span>
        <div style="font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: #8ba0b0;">Orders</div>
        <div class="mono" style="font-size: 20px; font-weight: 600; color: #0f2536;">318</div>
      </div>
      <div style="position: relative; overflow: hidden; border-radius: 16px; border: 1px solid rgba(224,69,90,0.18); background: #ffffff; box-shadow: 0 1px 2px rgba(13,60,82,0.04), 0 8px 20px -10px rgba(13,60,82,0.12); padding: 13px 16px 13px 20px; display: flex; align-items: center; justify-content: space-between;">
        <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 999px; background: #e0455a;"></span>
        <div style="font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: #8ba0b0;">Past deadline now</div>
        <div class="mono" style="font-size: 20px; font-weight: 600; color: #e0455a;">6</div>
      </div>
      <div style="display: flex; gap: 8px;">
        <div style="flex: 1; min-width: 0; border-radius: 16px; border: 1px solid rgba(13,110,140,0.1); background: #ffffff; box-shadow: 0 1px 2px rgba(13,60,82,0.04); padding: 10px 12px;">
          <div style="font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: #8ba0b0;">Avg order</div>
          <div class="mono" style="margin-top: 3px; font-size: 15px; font-weight: 600;">₹1,319</div>
        </div>
        <div style="flex: 1; min-width: 0; border-radius: 16px; border: 1px solid rgba(217,138,43,0.18); background: #ffffff; box-shadow: 0 1px 2px rgba(13,60,82,0.04); padding: 10px 12px;">
          <div style="font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: #8ba0b0;">Cancel rate</div>
          <div class="mono" style="margin-top: 3px; font-size: 15px; font-weight: 600; color: #d98a2b;">9%</div>
        </div>
      </div>
    </div>

    <!-- status breakdown: horizontal bars read fine narrow, kept from desktop -->
    <div style="border-radius: 16px; border: 1px solid rgba(13,110,140,0.1); background: #ffffff; box-shadow: 0 1px 2px rgba(13,60,82,0.04); padding: 16px;">
      <div style="font-size: 13.5px; font-weight: 600;">Where orders stand</div>
      <div style="margin-top: 2px; margin-bottom: 12px; font-size: 11.5px; color: #5c7386;">318 orders · 58% COD</div>
      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div>
          <div style="display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 4px;"><span>Fulfilled</span><span class="mono" style="color:#5c7386;">211</span></div>
          <div style="height: 6px; border-radius: 999px; background: #eef6fa; overflow: hidden;"><div style="width: 66%; height: 100%; background: #10b981;"></div></div>
        </div>
        <div>
          <div style="display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 4px;"><span>In progress</span><span class="mono" style="color:#5c7386;">78</span></div>
          <div style="height: 6px; border-radius: 999px; background: #eef6fa; overflow: hidden;"><div style="width: 25%; height: 100%; background: #0ea5e9;"></div></div>
        </div>
        <div>
          <div style="display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 4px;"><span>Returned</span><span class="mono" style="color:#5c7386;">14</span></div>
          <div style="height: 6px; border-radius: 999px; background: #eef6fa; overflow: hidden;"><div style="width: 4%; height: 100%; background: #e0455a;"></div></div>
        </div>
      </div>
    </div>

    <!-- trend chart: kept but full width, single metric per card as on desktop -->
    <div style="border-radius: 16px; border: 1px solid rgba(13,110,140,0.1); background: #ffffff; box-shadow: 0 1px 2px rgba(13,60,82,0.04); padding: 16px;">
      <div style="font-size: 13.5px; font-weight: 600;">Revenue</div>
      <div style="margin-top: 2px; margin-bottom: 10px; font-size: 11.5px; color: #5c7386;">Excludes cancelled, RTO and returned</div>
      <svg viewBox="0 0 320 90" width="100%" height="90" preserveAspectRatio="none">
        <polyline points="0,70 30,55 60,60 90,40 120,45 150,30 180,35 210,20 240,28 270,15 300,22 320,10" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <polygon points="0,70 30,55 60,60 90,40 120,45 150,30 180,35 210,20 240,28 270,15 300,22 320,10 320,90 0,90" fill="rgba(14,165,233,0.08)"/>
      </svg>
    </div>

    <div style="height: 4px;"></div>
  </div>

  <!-- bottom tab bar: the desktop switch + avatar menu collapse into thumb-reach nav -->
  <div style="flex-shrink: 0; display: flex; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 10px)); background: #ffffff; border-top: 1px solid rgba(13,110,140,0.1); box-shadow: 0 -1px 1px rgba(13,60,82,0.04), 0 -10px 24px -12px rgba(13,60,82,0.1);">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; border-radius: 12px; color: #0ea5e9; background: rgba(14,165,233,0.1);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      <span style="font-size: 10.5px; font-weight: 600;">Dashboard</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: #5c7386;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18l-1.5 12H5.5L4 3Z"/><path d="M4 8h16"/></svg>
      <span style="font-size: 10.5px; font-weight: 500;">Orders</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: #5c7386;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
      <span style="font-size: 10.5px; font-weight: 500;">Pack</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: #5c7386;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.41.16.77.43 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      <span style="font-size: 10.5px; font-weight: 500;">More</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
