<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #0ea5e9; } a:hover { color: #0284c7; }

<!-- Tapping the product thumbnail alone (not the rest of the card) opens
     this — just the image, enlarged, on a scrim. No order info, no
     actions: a lightweight lightbox, not a second detail screen. -->
<div style="width: 375px; height: 812px; box-sizing: border-box; background: rgba(8,20,28,0.86); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;">

  <button style="position: absolute; top: 18px; right: 16px; width: 38px; height: 38px; border-radius: 999px; border: none; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
  </button>

  <div style="width: 311px; height: 390px; border-radius: 16px; background: linear-gradient(155deg, #7d2c3c, #4d1a24); box-shadow: 0 20px 60px -12px rgba(0,0,0,0.5);"></div>

</div>
</x-dc>

</html>
